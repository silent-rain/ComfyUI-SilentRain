[package]
name = "comfy_node_macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macro crate for ComfyUI v3 node development"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Optional: for better error messages
synstructure = "0.13"
